version: 1.0.{build}
image: Ubuntu

environment:
  nodejs_version: "20"
  # Add these secure variables in your AppVeyor project settings:
  # SSH_PRIVATE_KEY
  # SSH_HOST
  # SSH_USER

init:
  - git config --global core.autocrlf input

install:
  - nvm install $nodejs_version
  - npm install -g npm@11.5.2
  - npm ci --prefer-offline --no-audit

build: off

# Until now this file ran `npm ci` and nothing else, so a green AppVeyor check
# meant only "the dependencies installed". Type errors and failing tests
# reached main unchallenged and first surfaced on the server, inside
# deploy.sh, after the merge had already triggered the deploy. These two
# steps are what the green check is supposed to stand for.
#
# `npm run typecheck` is turbo-driven, so it builds the shared packages first
# and then typechecks every workspace that defines the task. apps/api's own
# typecheck regenerates the Prisma client before running tsc — the client is
# generated code, and a stale one reports errors for schema fields that do
# exist. The api test task compiles to dist/ and runs node:test over it, so
# it also proves the real build succeeds.
#
# That task expands the test file list with find/xargs rather than handing
# node --test a glob: glob support landed after the Node 20 pinned above, so
# a glob is taken literally here and fails with "Could not find". Passing
# the directory instead doesn't work on any version — node treats it as a
# module to load.
test_script:
  - npm run typecheck
  - npm run test --workspace=api

deploy_script:
  - sh: |
      if [ "$APPVEYOR_REPO_BRANCH" = "main" ]; then
        echo "Setting up SSH for deployment..."
        mkdir -p ~/.ssh
        echo "$SSH_PRIVATE_KEY" | base64 -d -i > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
        ssh-keyscan -t rsa,ed25519 $SSH_HOST >> ~/.ssh/known_hosts 2>/dev/null
        
        echo "Deploying to $SSH_HOST..."
        ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new $SSH_USER@$SSH_HOST "cd /opt/naijaspride && ./deploy.sh"
        echo "Deployment triggered successfully!"
      else
        echo "Skipping deployment for non-main branch."
      fi

cache:
  - ~/.npm -> package-lock.json
